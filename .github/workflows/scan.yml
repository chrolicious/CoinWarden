name: Hourly AH scan

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      max_new_items:
        description: "Max item metadata records to fetch this run (raise for a one-off backfill)"
        default: "1500"
        required: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m core.main
        env:
          PYTHONUNBUFFERED: "1"
          COINWARDEN_MAX_NEW_ITEMS: ${{ inputs.max_new_items || '1500' }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REGION: eu
          WOW_REALM_SLUGS: ravencrest,frostmane,darkspear,silvermoon,sylvanas
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: coinwarden
