name: Hourly AH scan

on:
  schedule:
    # GitHub can delay/drop scheduled runs under load - observed gaps up to
    # ~6h with only 2 slots/hour. More slots raise the odds one actually
    # fires; each is near-free when skipped (skip-if-recent exits in
    # seconds). This does not fully solve platform-wide scheduling delays,
    # since all schedule: triggers share the same queue - see the skip-if-
    # recent step below for the real mitigation (gap-aware sale detection
    # degrades gracefully rather than corrupting data when a gap happens).
    - cron: "5,15,25,35,45,55 * * * *"
  workflow_dispatch:
    inputs:
      max_new_items:
        description: "Max item metadata records to fetch this run (raise for a one-off backfill)"
        default: "1500"
        required: false

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
    steps:
      - name: Skip if a run succeeded in the last 50 minutes
        id: recent
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan.yml --status success --limit 1 \
                 --json updatedAt -q '.[0].updatedAt')
          if [ -n "$last" ]; then
            age=$(( $(date +%s) - $(date -d "$last" +%s) ))
            echo "last success ${age}s ago"
            if [ "$age" -lt 3000 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/checkout@v4
        if: steps.recent.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.recent.outputs.skip != 'true'
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.recent.outputs.skip != 'true'

      - run: python -m core.main
        if: steps.recent.outputs.skip != 'true'
        env:
          PYTHONUNBUFFERED: "1"
          COINWARDEN_MAX_NEW_ITEMS: ${{ inputs.max_new_items || '1500' }}
          BNET_CLIENT_ID: ${{ secrets.BNET_CLIENT_ID }}
          BNET_CLIENT_SECRET: ${{ secrets.BNET_CLIENT_SECRET }}
          BNET_REGION: eu
          WOW_REALM_SLUGS: ravencrest,frostmane,darkspear,silvermoon,sylvanas
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: coinwarden
