<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinWarden</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10); --accent: #2a78d6;
    --good: #006300; --bad: #d03b3b; --hover: rgba(11,11,11,0.04);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5;
      --good: #0ca30c; --bad: #e66767; --hover: rgba(255,255,255,0.05);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10); --accent: #3987e5;
    --good: #0ca30c; --bad: #e66767; --hover: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
  }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  button, input, select { font: inherit; color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }

  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--grid); margin-bottom: 12px; }
  nav.tabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--ink-2); }
  nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: end; margin-bottom: 12px; }
  .filters label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--ink-2); }
  .filters input, .filters select { width: 110px; padding: 5px 7px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .filters input.wide { width: 200px; }
  .filters .check { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 6px; }
  .filters .check input { width: auto; }
  .filters .reset { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--ink-2); font-weight: 600; font-size: 12px; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
  th.sorted::after { content: " ▾"; color: var(--muted); }
  th.sorted.asc::after { content: " ▴"; }
  th:first-child, td:first-child, th.left, td.left { text-align: left; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--hover); }
  td.item { display: flex; align-items: center; gap: 8px; min-width: 240px; white-space: normal; }
  td.item img { width: 24px; height: 24px; border-radius: 4px; background: var(--grid); flex: none; }
  td.item .name { font-weight: 500; }
  td.item .sub { color: var(--muted); font-size: 12px; }
  .realm { color: var(--ink-2); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .star { background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 16px; padding: 0 4px; line-height: 1; }
  .star.on { color: #eda100; }
  .empty { padding: 24px; color: var(--muted); text-align: center; }
  .count { color: var(--muted); font-size: 12px; margin: 0 0 8px; }

  /* detail */
  .back { background: none; border: 0; cursor: pointer; color: var(--accent); padding: 0; margin-bottom: 8px; }
  .detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .detail-head img { width: 40px; height: 40px; border-radius: 6px; background: var(--grid); }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .detail-head .sub { color: var(--muted); font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .tile .l { color: var(--ink-2); font-size: 12px; display: flex; align-items: center; }
  .tile .v { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .tile .d { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .chart-card { padding: 12px; }
  .chart-controls { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-bottom: 8px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { background: none; border: 0; padding: 4px 10px; cursor: pointer; color: var(--ink-2); }
  .seg button[aria-pressed="true"] { background: var(--hover); color: var(--ink); font-weight: 600; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; }
  .legend label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend .key { width: 16px; height: 2px; background: currentColor; display: inline-block; }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; height: 280px; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); min-width: 140px; display: none; }
  .chart .tip .t { color: var(--muted); margin-bottom: 4px; }
  .chart .tip .row { display: flex; justify-content: space-between; gap: 12px; }
  .chart .tip .row b { font-variant-numeric: tabular-nums; }
  .chart .tip .key { width: 12px; height: 2px; display: inline-block; margin-right: 6px; vertical-align: middle; }
  .chart-empty { padding: 40px; color: var(--muted); text-align: center; }
  details.tv { margin-top: 8px; }
  details.tv summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CoinWarden</h1>
    <span class="meta" id="meta">loading…</span>
    <span class="spacer"></span>
    <span class="meta" id="realms"></span>
  </header>
  <div id="app"></div>
</div>
<script src="app.js"></script>
</body>
</html>
