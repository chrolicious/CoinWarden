name = "coinwarden"
main = "worker/index.js"
compatibility_date = "2026-09-01"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[assets]
directory = "web"
binding = "ASSETS"

[[r2_buckets]]
binding = "DATA"
bucket_name = "coinwarden"
